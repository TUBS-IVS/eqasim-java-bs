on:
  push:
    branches:
      - main
  
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # This fork intentionally releases WITHOUT publishing artifacts. Upstream
      # deploys org.eqasim:eqasim to packagecloud.io/eth-ivt/eqasim, and the fork
      # inherited both those coordinates (see distributionManagement in pom.xml)
      # and the upstream groupId. Publishing from here would push fork artifacts
      # into a third party's registry under the coordinates upstream needs for
      # its own releases, so the build and deploy steps were removed. Downstream
      # consumers build this fork from source instead (eqasim_source_path in the
      # eqasim-bs pipeline). A release therefore produces exactly a tag, a
      # GitHub release and an updated CHANGELOG.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # The RELEASE PAT secret is not defined in this fork, which made every
          # main-push run fail with "Input required and not supplied: token"
          # (empty expression = no input supplied). Fall back to the built-in
          # GITHUB_TOKEN: the permissions block above grants contents + PR write,
          # which is all release-please needs to open the release pull request and
          # to create the tag and GitHub release. Releases created with
          # GITHUB_TOKEN do not trigger further workflows, which is harmless here
          # because no workflow is meant to react to a release. A RELEASE PAT
          # defined later takes precedence automatically.
          token: ${{ secrets.RELEASE || secrets.GITHUB_TOKEN }}
