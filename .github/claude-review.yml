# Gate for the automatic Claude PR review (.github/workflows/claude-review.yml).
#
# The central gate (TUBS-IVS/claude-pr-review, claude_review.py classify) reads this file and the PR diff and decides,
# without calling any model, whether the review runs and at which tier. Every
# decision is written with its reason to the job summary, so a skipped review is
# never silent. Mechanism: TUBS-IVS/claude-pr-review, docs/how-it-works.md.
#
# ASSUMPTION: all thresholds below are starting values, not measured; each block names
# the date its values were chosen. Re-tune them from the run records in the job summaries
# (status, turns) and the reviews' cost in the Anthropic Console (no review output shows it).

labels:
  force: claude-review        # adding it starts ONE deep-tier review; later pushes are gated normally
  skip: skip-claude-review    # never review while set

# Draft PRs are reviewed only when the force label is added.
skip_drafts: true

# Paths whose changes can alter simulation behaviour or results of the Braunschweig
# model, the build, or this review gate itself. Glob syntax: "**" matches across
# directories, "*" and "?" stay within one path segment (not fnmatch semantics).
critical_paths:
  - "braunschweig/src/main/**"
  - "core/src/main/**"
  - "pom.xml"
  - "braunschweig/pom.xml"
  - "core/pom.xml"
  - ".github/workflows/**"
  - ".github/claude-review.yml"
  - ".github/claude-review-prompt.md"

# Paths that never count towards the changed-line totals or the file count
# (generated, machine-written, or upstream region modules the Braunschweig model
# does not use; reviewing them costs tokens and finds nothing relevant).
ignored_paths:
  - "**/dependency-reduced-pom.xml"
  - "**/target/**"
  - "CHANGELOG.md"
  - "version.txt"
  - "ile_de_france/**"
  - "switzerland/**"
  - "sao_paulo/**"
  - "san_francisco/**"
  - "los_angeles/**"

# Paths that hold the backbone of the repository: the Maven build, the run and module wiring of the Braunschweig model and of eqasim core, the scenario setup, the workflows and this gate. A change that restructures
# them gets the deep tier (see `thresholds`). Every structure path also counts as critical. Same
# glob syntax as critical_paths. ASSUMPTION: the list was chosen on 2026-11-02 from the layout
# of the repository; extend it when a new part becomes load-bearing.
structure_paths:
  - "pom.xml"
  - "braunschweig/pom.xml"
  - "core/pom.xml"
  - "braunschweig/src/main/java/org/eqasim/braunschweig/*.java"
  - "braunschweig/src/main/java/org/eqasim/braunschweig/scenario/**"
  - "braunschweig/src/main/java/org/eqasim/braunschweig/mode_choice/*.java"
  - "braunschweig/src/main/resources/**"
  - "core/src/main/java/org/eqasim/core/simulation/*.java"
  - "core/src/main/java/org/eqasim/core/simulation/mode_choice/*.java"
  - ".github/workflows/**"
  - ".github/claude-review.yml"
  - ".github/claude-review-prompt.md"

# Documentation and tests (claude-pr-review v1.5.0): their changed lines and files do not count towards
# the deep tier's size thresholds; they still count for the full tier and are still reviewed.
supporting_paths:
  - "docs/**"
  - "tests/**"
  - "**/src/test/**"
  - "**/*.md"

# Branch kinds (prefix before "/") that skip the review unless a critical path is touched.
skip_kinds:
  - docs

# Three tiers (claude_review.py classify, first match wins):
#   deep  - a structure file added, deleted or renamed; or >= deep_min_structure_files structure
#           files or >= deep_min_structure_lines changed lines in structure files; or a large
#           change anywhere (>= deep_min_lines lines or >= deep_min_files files)
#   full  - a critical path touched, or >= full_min_lines lines, or >= full_min_files files
#   light - every other change with at least one counted line or file
# ASSUMPTION: starting values chosen on 2026-11-02 (as in eqasim-bs, ADR-0175 there; the full
# thresholds are the former light ones), re-tune them from the run records and the cost in the Console.
thresholds:
  deep_min_structure_files: 5   # changed structure files for the deep tier
  deep_min_structure_lines: 300 # changed lines in structure files for the deep tier
  deep_min_lines: 1000          # changed lines anywhere for the deep tier
  deep_min_files: 25            # changed files anywhere for the deep tier
  full_min_lines: 150           # changed lines for the full tier
  full_min_files: 8             # changed files for the full tier

# Further rounds on the same PR (after a push to a PR the review has already seen). The gate
# then measures only the files whose change against main differs from the last complete round
# (claude_review.py interdiff), with the thresholds above; a file added, deleted or renamed
# since the last complete round counts as a structure change. A push the rules above would not
# review (a docs/ branch without a critical path) still gets verify_tier while findings of
# earlier rounds are open, so a fix is checked; a push of ignored files alone gets no run, like
# a merge of the base branch: it cannot fix a finding. After max_rounds automatic rounds the
# review stops; adding the force label reads the whole PR again and does not count. ASSUMPTION:
# starting values chosen on 2026-10-28 (as in eqasim-bs, ADR-0171 there), re-tune from the run
# records and the cost in the Console.
rereview:
  max_rounds: 3
  verify_tier: light
  # claude-pr-review v1.5.0: a push of at most this many changed lines is only checked, on verify_tier,
  # at verify_effort (as every verify round). ASSUMPTION: starting values of 2026-11-12, re-tune from
  # the run records.
  small_push_lines: 60
  verify_effort: medium

# Each tier's hard budget per run (claude -p --max-budget-usd) is the owner's and comes from the
# organization secret CLAUDE_REVIEW_BUDGETS, which the caller passes: no budget is published
# (ADR-0181 in TUBS-IVS/eqasim-bs). The turn limits are an ASSUMPTION (the budget is the binding
# limit), re-tune them from the run records and the cost in the Console.
# effort: the reasoning level of each run (claude -p --effort: low, medium, high, xhigh, max;
# without it the model's default applies, medium on Opus 5.5 and Sonnet 5.5, high on Fable 5.1).
# Owner's choice (2026-11-04): xhigh on every tier.
tiers:
  light:
    model: claude-sonnet-5-5
    max_turns: 25
    effort: xhigh
  full:
    model: claude-opus-5-5
    max_turns: 250
    effort: xhigh
  deep:
    model: claude-fable-5-1
    max_turns: 250
    effort: xhigh

# The review run (claude_review.py review, TUBS-IVS/claude-pr-review). The model only reads; posting
# is done by the script, which also writes the PR diff to a file the model reads (no shell
# tools). Placeholders in the prompt file: {{REPO}}, {{PR}}, {{TIER}}, {{SHA}}, {{PR_TITLE}},
# {{FENCE}}, {{PR_BODY}}, {{DIFF_BLOCK}}, {{ROUND_BLOCK}}.
review:
  prompt_file: .github/claude-review-prompt.md
  allowed_tools:
    - Read
    - Grep
    - Glob
